apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      # hostNetwork is required so the container's netlink socket receives
      # kernel block device uevents (add/remove/change), which are broadcast
      # to the host network namespace only.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: false
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args:
        - --node-name=$(NODE_NAME)
        - --udev-data-dir=/run/udev/data
        - --poll-interval={{ .Values.pollInterval }}
        - --event-debounce={{ .Values.eventDebounce }}
        - --smartctl-timeout={{ .Values.smartctlTimeout }}
        {{- range .Values.discovery.exclude }}
        {{- if . }}
        - {{ printf "--exclude-disk=%s" . | quote }}
        {{- end }}
        {{- end }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if hasKey .Values.metrics "enabled" }}
        - --metrics-enabled={{ .Values.metrics.enabled }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: udev-data
          mountPath: /run/udev/data
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: udev-data
        hostPath:
          path: /run/udev/data
      - name: sys
        hostPath:
          path: /sys
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

                    type: integer
                  criticalWarning:
                    description: CriticalWarning is the NVMe critical warning bitmask.
                    type: integer
                  mediaErrors:
                    description: MediaErrors is the number of unrecovered data integrity
                      errors (NVMe).
                    format: int64
                    type: integer
                  pendingSectors:
                    description: PendingSectors is the number of pending sectors (ATA
                      197).
                    format: int64
                    type: integer
                  percentageUsed:
                    description: PercentageUsed is the percentage of NVM subsystem
                      life used (NVMe).
                    type: integer
                  powerCycleCount:
                    description: PowerCycleCount is the number of power cycles.
                    format: int64
                    type: integer
                  powerOnHours:
                    description: PowerOnHours is the lifetime power-on hours of the

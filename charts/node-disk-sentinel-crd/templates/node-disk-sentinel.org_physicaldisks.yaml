                      type: integer
                    attributeName:
                      description: AttributeName is the human-readable attribute or
                        metric name.
                      type: string
                    id:
                      description: ID is an internal identifier for this finding.
                      type: string
                    message:
                      description: Message provides a diagnostic explanation of the
                        finding.
                      type: string
                    rawValue:
                      description: RawValue is the raw value recorded for this attribute.
                      format: int64
                      type: integer
                  required:
                  - id
                  - message
                  type: object

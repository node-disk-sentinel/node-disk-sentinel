                properties:
                  smartctl:
                    description: Smartctl configures the smartctl collector.
                    properties:
                      extraCmdArgs:
                        description: |-
                          ExtraCmdArgs specifies additional smartctl command-line arguments
                          (e.g. "-d sat -T permissive").
                        maxLength: 256
                        type: string
                    type: object
                type: object
            required:

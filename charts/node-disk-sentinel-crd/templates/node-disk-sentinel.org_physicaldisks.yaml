      type: string
    - jsonPath: .status.conditions[?(@.type=="DataCollected")].reason
      name: Collection
      type: string
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .status.info.model
      name: Model
      type: string
    - jsonPath: .status.info.rotational
      name: Rotational
      type: boolean
    - jsonPath: .status.info.capacity
      name: Capacity
      type: integer
    - jsonPath: .status.telemetry.temperatureCelsius
      name: Temp
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PhysicalDisk is the Schema for the physicaldisks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PhysicalDiskSpec defines the desired state of PhysicalDisk.
            properties:
              nodeName:
                description: NodeName is the name of the Kubernetes Node where this
                  disk resides.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string

                  - SectorErrors
                  - ExcessiveSectorErrors
                  - AttributeFailingNow
                  - AttributeFailedInPast
                  - SelfAssessmentFailed
                  - KernelErrors
                  - Unknown
                - enum:
                  - Good
                  - SectorErrors
                  - ExcessiveSectorErrors
                  - AttributeFailingNow
                  - AttributeFailedInPast
                  - SelfAssessmentFailed
                  - KernelErrors
                  - Unknown
                description: |-
                  Health reflects the evaluated health status (e.g. Good, ExcessiveSectorErrors).
                  Invariant: health == conditions[Degraded].reason
                type: string
              info:
                description: Info contains static and udev-reported hardware metadata.
                properties:
                  bus:
                    description: Bus subsystem or transport (e.g. ata, scsi, nvme,
                      usb).
                    type: string
                  busPath:
                    description: BusPath is the hardware bus topology path.
                    type: string
                  canonicalPath:
                    description: CanonicalPath is the kernel device path resolved

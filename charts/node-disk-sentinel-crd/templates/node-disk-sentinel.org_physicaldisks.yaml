                    type: boolean
                  serial:
                    description: Serial number of the device.
                    type: string
                  serialShort:
                    description: SerialShort is the shortened serial number from udev.
                    type: string
                  sysPath:
                    description: SysPath is the sysfs path (e.g. /sys/devices/...).
                    type: string
                  type:
                    description: Type of device (e.g. disk).
                    type: string
                  vendor:
                    description: Vendor identifier.
                    type: string
                  wwn:
                    description: WWN is the World Wide Name identifier.
                    type: string
                type: object
              lastDataCollectedTime:
